name: Build ESP32 Firmware

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FQBN: esp32:esp32:esp32
  ESP32_CORE_VERSION: 2.0.17
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # จำเป็นสำหรับสร้าง Release และแนบไฟล์
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # หาไฟล์ .ino ในรีโปให้เอง แล้วคัดลอกไปไว้ในโฟลเดอร์ที่ชื่อตรงกับไฟล์
      - name: Prepare sketch
        run: |
          echo "ไฟล์ .ino ทั้งหมดในรีโป:"
          find . -name "*.ino" -not -path "./.git/*" -not -path "./_sketch/*"
          INO=$(find . -name "*.ino" -not -path "./.git/*" -not -path "./_sketch/*" | head -n 1)
          if [ -z "$INO" ]; then
            echo "::error::ไม่พบไฟล์ .ino ในรีโป"
            exit 1
          fi
          echo "ใช้ sketch: $INO"
          NAME=$(basename "$INO" .ino)
          mkdir -p "_sketch/$NAME"
          cp "$INO" "_sketch/$NAME/$NAME.ino"
          echo "SKETCH_DIR=_sketch/$NAME" >> "$GITHUB_ENV"
          echo "--- ตรวจเนื้อหา sketch ---"
          grep -n "define USE_OLED" "$INO" || echo "ไม่มี USE_OLED (ไฟล์เก่า?)"
          grep -n "U8g2lib\|Adafruit_SSD1306" "$INO" || true

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE_VERSION}

      - name: Install libraries
        run: arduino-cli lib install "U8g2"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn ${FQBN} \
            --export-binaries \
            --warnings default \
            "${SKETCH_DIR}"

      # core 2.0.17 ไม่สร้าง merged.bin ให้ จึงรวมเองด้วย esptool
      - name: Create merged.bin
        run: |
          pip install "esptool==4.8.1"
          NAME=$(basename "${SKETCH_DIR}")
          B=$(dirname "$(find "${SKETCH_DIR}/build" -name '*.ino.bin' | head -n 1)")
          BOOT="$HOME/.arduino15/packages/esp32/hardware/esp32/${ESP32_CORE_VERSION}/tools/partitions/boot_app0.bin"
          ls -l "$B" "$BOOT"
          esptool.py --chip esp32 merge_bin \
            -o "$B/${NAME}.ino.merged.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x1000 "$B/${NAME}.ino.bootloader.bin" \
            0x8000 "$B/${NAME}.ino.partitions.bin" \
            0xe000 "$BOOT" \
            0x10000 "$B/${NAME}.ino.bin"

      - name: List output
        run: find "${SKETCH_DIR}/build" -type f -name "*.bin" -exec ls -lh {} \;

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Weather-firmware
          path: ${{ env.SKETCH_DIR }}/build/**/*.bin
          if-no-files-found: error

      # สร้าง Release อัตโนมัติทุกครั้งที่ push (ไม่รวม pull request)
      # push tag v* จะใช้ชื่อ tag นั้น ส่วน push ปกติจะได้ tag เป็น build-<เลขรอบ>
      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          target_commitish: "${{ github.sha }}"
          name: "Firmware ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          body: |
            ไฟล์เฟิร์มแวร์ ESP32 (commit ${{ github.sha }})
            เบิร์นไฟล์ `*.merged.bin` ที่ address 0x0
          files: ${{ env.SKETCH_DIR }}/build/**/*.bin
